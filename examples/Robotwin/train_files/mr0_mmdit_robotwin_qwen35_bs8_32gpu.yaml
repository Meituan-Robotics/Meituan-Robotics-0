run_id: robotwin_all50_224_qwen35vl4b_mmdit_psi0_cond_jit_stage2langmix250kinit_chunk100_bs8_32gpu
run_root_dir: /PATH/TO/checkpoints
seed: 42
trackers: [jsonl, tensorboard]
wandb_entity: your_wandb_entity
wandb_project: mr0
is_debug: false

framework:
  name: QwenMMDiT
  qwenvl:
    # Set to the local path or HF hub id of the Qwen3.5-4B-Action pretrained VLM
    base_vlm: /PATH/TO/Qwen3.5-4B-Action
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2560

  action_model:
    action_model_type: MMDiT-Psi0
    action_dim: 14
    state_dim: 14
    future_action_window_size: 99
    action_horizon: 100
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    vl_feature_dim: 2560
    num_target_vision_tokens: 32
    add_pos_embed: true
    max_seq_len: 1024
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 10
    state_placement: condition
    state_dropout_ratio: 0.0
    prediction_type: sample
    t_eps: 0.05
  obs_image_size: [224, 224]

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    # Root dir containing the RoboTwin LeRobot dataset(s)
    data_root_dir: /PATH/TO/RoboTwin
    data_mix: robotwin_all_100
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 8
    load_all_data_for_training: true
    image_size: [224, 224]
    video_backend: torchcodec
    include_state: true

trainer:
  epochs: 100
  max_train_steps: 1000000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 10000
  learning_rate:
    base: 1e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.0
  warmup_ratio: 0.1
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  is_resume: true
  resume_epoch: null
  resume_step: null
  # Warm-start from a Stage2-MMDiT pretrained checkpoint (both VLM and MMDiT head
  # main trunk load via shape filter; IO layers reinit if action_dim / chunk differ).
  pretrained_checkpoint: /PATH/TO/stage2_pretrained_pytorch_model.pt
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
