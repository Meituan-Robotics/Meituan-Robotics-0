# MR0 MMDiT post-training example for dual-arm xyz + rot6d + gripper actions.
# Set base_vlm, data_root_dir, modality_root_dir, and run_root_dir for your data.
# For the bundled OpenPI continuous-gripper adapter, export MR0_NORMALIZATION_MODE=q99
# on every training node and pass --normalization_mode q99 to the server.
# To initialize from Stage1-FAST, set trainer.pretrained_checkpoint and
# trainer.reload_modules=qwen_vl_interface; leave the MMDiT head randomly initialized.

run_id: agilex_block_500sft_100hil_224_qwen35vl4b_mmdit_vlm_only_init_smoke
run_root_dir: results
seed: 42
trackers: [jsonl, tensorboard]
wandb_entity: your_wandb_entity
wandb_project: mr0
is_debug: false

framework:
  name: QwenMMDiT
  qwenvl:
    base_vlm: pretrained_models/Qwen3.5-4B-Action
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2560

  action_model:
    action_model_type: MMDiT-Psi0
    action_dim: 20
    state_dim: 20
    future_action_window_size: 49
    action_horizon: 50
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    vl_feature_dim: 2560
    num_target_vision_tokens: 32
    add_pos_embed: true
    max_seq_len: 1024
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 10
    state_placement: condition
    state_dropout_ratio: 0.0
    # JiT (Just image Transformer) / AML A1: head outputs x_hat0, loss stays in v-space.
    prediction_type: sample
    t_eps: 0.05
  obs_image_size: [224, 224]
  # Phase-4 RECAP routing. Keep disabled for non-RECAP datasets without advantage labels.
  advantage_conditioning: false
  positive_only_conditional: true
  unconditional_prob: 0.3

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /PATH/TO/LeRobotData
    data_mix: auto
    # Required only when data_mix=auto: discover immediate child datasets with meta/info.json.
    auto_discover_robot_type: agile_x_eef_6d
    # Shadow metadata root: modality.json (+ steps/norm caches) live here, NOT in the dataset dir
    # (its Norm subsets are symlinks we must not pollute). Generated by gen_block_modality_shadow.py.
    modality_root_dir: /PATH/TO/modality_shadow
    action_type: abs_eef
    action_mode: abs
    # Sample each subset proportional to its valid-window count (= openpi ConcatDataset uniform).
    balance_dataset_weights: True
    balance_trajectory_weights: False
    lazy_step_sampling: False
    sequential_step_sampling: False
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 8
    load_all_data_for_training: true
    image_size: [224, 224]
    video_backend: torchcodec
    include_state: true
    gripper_mask_mode: none
    gripper_mask_root_dir: null
    gripper_mask_indices: [9, 19]
    # Empty disables Phase-3 labels; select the raw or smoothed filename explicitly.
    # Enabled sidecars require a unique, complete boolean label for every sampled frame.
    advantage_sidecar_filename: null
    advantage_root_dir: null

trainer:
  epochs: 200
  max_train_steps: 100
  num_warmup_steps: 10
  save_interval: 100
  eval_interval: 1000
  # MMDiT head is randomly initialized → higher lr than the pretrained VLM backbone.
  # Matches internal reference: backbone 1e-5, action_model 1e-4.
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.0
  warmup_ratio: 0.1
  logging_frequency: 100
  gradient_clipping: 1.0
  # per_device 8 x 8 GPUs x accum 2 = global batch 128.
  gradient_accumulation_steps: 2

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  # is_resume=true: resume from a local checkpoint under results/<run_id>/checkpoints if one
  # exists (failover/restart); otherwise fall through to pretrained_checkpoint as init
  # (completed_steps -> 0). pretrained_checkpoint + reload_modules supplied by the launch script.
  is_resume: false
  reload_modules: ''
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
